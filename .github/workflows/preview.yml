name: Preview

# Uploads preview versions of changed apps and deploys changed services to staging.
# Pull requests from forks never get here with secrets: GitHub withholds them, and
# the job is skipped. A maintainer can re-run it after reviewing the code.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upload previews of changed apps and services
        run: pnpm --filter "...[origin/${{ github.base_ref }}]" run --if-present preview:upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
