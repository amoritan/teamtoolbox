name: Deploy

# Deploys every app and service that changed since the previous push to main,
# plus everything that depends on a changed package (scripts/deploy-changed.ts).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploy only what passes, even if the CI workflow is still running.
      - run: pnpm check:headers
      - run: pnpm typecheck
      - run: pnpm test
      - name: Deploy changed apps and services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE: ${{ github.event.before }}
        # Services first, then apps, one at a time. On a first push or rewritten
        # history, BEFORE isn't in the checkout and everything is deployed.
        run: node scripts/deploy-changed.ts deploy "$BEFORE"
