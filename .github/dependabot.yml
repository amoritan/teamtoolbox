# Weekly version updates. Security updates are switched on separately, under
# Settings → Code security, and aren't grouped or delayed.
# The cooldown keeps brand-new releases out, in line with pnpm's minimum release age.

version: 2
updates:
  - package-ecosystem: npm # Also covers pnpm workspaces
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
